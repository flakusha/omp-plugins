# minimax / MiniMax-M3 profile fragment for oh-my-pi.
# Fragments are deep-merged over agent/config.yml (the base) by the installer;
# the assembled complete config is written to the live profile's config.yml.
# Map keys merge recursively; lists replace wholesale; scalars override.
# Only per-profile deltas live here. Ship a config.yml alongside (or instead of)
# this file to fully override the assembled result.
theme:
  dark: dark-tundra
  light: light
modelRoles:
  default: minimax-code/MiniMax-M3.1-Flash-Preview
  tiny: minimax-code/MiniMax-M2.7-highspeed:off
  advisor: minimax-code/MiniMax-M2.5-lightning:low
  smol: minimax-code/MiniMax-M2.7-highspeed:low
  slow: minimax-code/MiniMax-M3:high
  plan: minimax-code/MiniMax-M3:high
  commit: minimax-code/MiniMax-M2.5-lightning:off
  memory: minimax-code/MiniMax-M2.5-lightning:off
  judge: minimax-code/MiniMax-M2.7-highspeed:low
  # vision: opencode-go/glm-5.3-flash
# Unpinned on purpose:
#   task — role-derived patterns feed the load-spread classifier; pinning would
#     freeze every subagent spawn to one model and defeat the rerouting.
#   web — no roster model declares webSearch capability. image/speech/dictation
#     — no roster models of those kinds.
# Vibe worker tiers: `vibe good` -> bundled `task` agent (inherits the strong
# M3 session model), `vibe fast` -> bundled `sonic` agent. Pin sonic to the
# mechanical tier (provider-free lightning variant).
task:
  agentModelOverrides:
    sonic: minimax-code/MiniMax-M2.7-highspeed:low
ttsr:
  contextMode: discard
  interruptMode: tool-only
  repeatMode: once
colorBlindMode: false
statusLine:
  compactThinkingLevel: false
  separator: powerline
  preset: nerd
compaction:
  thresholdTokens: 200000
dev:
  autoqaConsent: granted
