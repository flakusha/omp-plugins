# glm / zai GLM-5.3 profile fragment for oh-my-pi.
# Fragments are deep-merged over agent/config.yml (the base) by the installer;
# the assembled complete config is written to the live profile's config.yml.
# Map keys merge recursively; lists replace wholesale; scalars override.
# Only per-profile deltas live here. Ship a config.yml alongside (or instead of)
# this file to fully override the assembled result.
# Runtime (rules/, hooks/, extensions/, skills/, plugins/) is shared with the
# default profile via installer-created symlinks — see PROFILE-LOADER-RESOLUTION.md.
modelRoles:
  default: zai/glm-5.3
  tiny: zai/glm-5.3-flash:off
  smol: zai/glm-5.3-flash:low
  slow: zai/glm-5.3:high
  advisor: zai/glm-5.3:off
  plan: zai/glm-5.3:high
  commit: opencode-go/mimo-v2.6-flash:off
  memory: zai/glm-5.3-flash:off
  judge: zai/glm-5.3-flash:off
  vision: zai/glm-4.6v-flash
# Unpinned on purpose:
#   task — role-derived patterns feed the load-spread classifier; pinning would
#     freeze every subagent spawn to one model and defeat the rerouting.
#   web — no roster model declares webSearch capability; pinning would resolve
#     to nothing. image/speech/dictation — no roster models of those kinds.
# Vibe worker tiers: `vibe good` -> bundled `task` agent (inherits the strong
# session model), `vibe fast` -> bundled `sonic` agent. Pin sonic to the
# mechanical tier of the approved roster (budget flash via opencode-go) so
# mechanical work leaves the primary zai quota alone.
task:
  agentModelOverrides:
    sonic: opencode-go/mimo-v2.6-flash:low
providers:
  maxInFlightRequests:
    zai: 20
theme:
  dark: dark-equinox
compaction:
  thresholdPercent: 75
  thresholdTokens: 300000
composer:
  tokenRate: true
statusLine:
  separator: powerline-thin
  preset: nerd
terminal:
  showProgress: true
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
  hideToolActivity: false
