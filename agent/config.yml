symbolPreset: nerd
setupVersion: 2
modelRoles: {}
defaultThinkingLevel: auto
advisor:
  enabled: false
  syncBacklog: "3"
  immuneTurns: 1
prewalk:
  enabled: false
contextPromotion:
  enabled: false
memory:
  backend: mnemopi
providers:
  memoryModel: lfm2-1.2b
  maxInFlightRequests:
    anthropic: 1
    opencode-go: 20
    opencode-zen: 20
    openrouter: 20
autolearn:
  enabled: true
mnemopi:
  polyphonicRecall: true
  enhancedRecall: true
  proactiveLinking: true
edit:
  mode: hashline
eval:
  # Both eval kernels disabled — computation goes through re-executable
  # .tmp/ scripts executed via bash (see the harness-tooling-discipline rule).
  # The lean-ctx-native-reroute pre-hook blocks residual eval calls with the
  # sanctioned workflow; harness-evasion-guard closes interpreter-inline
  # bypasses (`python -c`, `node -e`, heredoc-to-interpreter).
  py: false
  js: false
readLineNumbers: true
read:
  renderMarkdown: true
  toolResultPreview: true
lsp:
  lazy: false
  formatOnWrite: false
skills:
  # Initial-context reduction: these skills live in ~/.agents/skills and are
  # otherwise listed with full descriptions in every session's system prompt
  # (~13KB measured). arkcli-* is BytePlus Ark CLI work; re-enable by removing
  # names here (or via `arkcli connect`, which re-adds the skills).
  ignoredSkills:
    - arkcli-agent
    - arkcli-api-explorer
    - arkcli-auth
    - arkcli-billing
    - arkcli-chat
    - arkcli-config
    - arkcli-connect
    - arkcli-custommodel
    - arkcli-deploy
    - arkcli-doctor
    - arkcli-gen
    - arkcli-helper
    - arkcli-iam
    - arkcli-infer-endpoint
    - arkcli-models
    - arkcli-onboard
    - arkcli-plans
    - arkcli-pricing
    - arkcli-profile
    - arkcli-resources
    - arkcli-shared
    - arkcli-train-finetune
    - arkcli-understand
    - arkcli-update
    - arkcli-usage
    - cavecrew
    - caveman
    - caveman-commit
    - caveman-compress
    - caveman-help
    - caveman-review
    - caveman-stats
    - find-skills
bash:
  allowCompoundCommands: true
bashInterceptor:
  enabled: true
  patterns:
    - pattern: ^\s*(cat|head|tail|less|more)\s+
      tool: read
      message: "Use the `read` tool instead of cat/head/tail (`{\"path\": \"…\"}`); cat only for paths outside the project root."
    - pattern: ^\s*(grep|rg|ripgrep|ag|ack)\s+
      tool: grep
      message: "Use the `grep` tool instead of grep/rg (`{\"pattern\": \"…\", \"path\": \"…\"}`)."
    - pattern: ^\s*(find|fd|locate)\s+.*(-name|-iname|-type|--type|-glob)
      tool: glob
      message: "Use the `glob` tool instead of find/fd (`{\"pattern\": \"…\"}`); directory listings: `read` on the directory."
    - pattern: ^\s*ls\s+
      tool: read
      message: "Use the `read` tool on a directory instead of `ls` (`{\"path\": \"…\"}`)."
    - pattern: ^\s*sed\s+(-i|--in-place)
      tool: edit
      message: "Use the `edit` tool instead of sed -i. It provides diff preview and fuzzy matching."
    - pattern: "^\\s*perl\\s+.*-[pn]?i"
      tool: edit
      message: "Use the `edit` tool instead of perl -i. It provides diff preview and fuzzy matching."
    - pattern: ^\s*awk\s+.*-i\s+inplace
      tool: edit
      message: "Use the `edit` tool instead of awk -i inplace. It provides diff preview and fuzzy matching."
    - pattern: "^\\s*(echo|printf|cat\\s*<<)\\s+(?:(?:[^\"'>]|\"[^\"]*\"|'[^']*')|(?<!\\|)>{1,2}\\|?\\s*(?:\"/dev/(?:null|tty|stdout|stderr)\"|'/dev/(?:null|tty|stdout|stderr)'|/dev/(?:null|tty|stdout|stderr))(?:[\\s;&|]|$))*(?<!\\|)>{1,2}\\|?\\s*(?!(?:\"/dev/(?:null|tty|stdout|stderr)\"|'/dev/(?:null|tty|stdout|stderr)'|/dev/(?:null|tty|stdout|stderr))(?:[\\s;&|]|$))[$\\w./~\"'-]"
      tool: write
      message: "Redirection writes: in-root `.tmp/` scratch via the `write` tool; in-repo project files via `ctx_patch` (lean-ctx, op `create`); targets outside the project root are blocked."
    - pattern: ^\s*nohup\s+|(?<!&)\&\s*$
      tool: hub
      message: "Use the `hub` tool (`op:\"start\"`) instead of nohup or background shell syntax so the process stays observable and managed."
    - pattern: ^\s*(?:(?:bun|npm|pnpm|yarn)\s+(?:run\s+)?(?:dev|start)(?:\s|$)|(?:vite|next\s+dev|nuxt\s+dev|nodemon|lldb|gdb|tail\s+-f)(?:\s|$)|docker\s+compose\s+up(?!.*(?:\s-d(?:\s|$)|--detach))(?:\s|$))
      tool: hub
      message: "Use the `hub` tool (`op:\"start\"`) for services, watchers, and debuggers so other omp instances can observe and control them."
    - pattern: ^\s*(?:(?:bun|npm|pnpm|yarn)\s+(?:run\s+)?\S+|cargo\s+watch|watchexec|pytest|vitest|jest|tsc)(?:.|\n)*(?:--watch|-w)(?:\s|$)
      tool: hub
      message: "Use the `hub` tool (`op:\"start\"`) for watch mode so its output, input, and lifecycle stay managed."
    - pattern: "git\\s+stash\\b(?![\\s\\S]*\\s--\\s+\\S)"
      tool: ask
      message: "Hard ban on `git stash` in shared-branch agent flows — agents repeatedly run stash despite the recommendation and sweep each other's in-flight work. Pathspec-scoped safe shape: `git stash push -- <files you own>`. Acceptable alternatives: (1) commit the change with `git add <files> && git commit -m \"...\"`; (2) use `git worktree add ../<dir>` for isolation. If the user has explicitly authorized a stash in this turn and you can show the exact pathspec covers only files you own, redo with `git stash push -- <pathspec>` and re-run."
    - pattern: git\s+push\b(?!\s+--dry-run)(?!\s+(-h|--help)\b)
      tool: ask
      message: "Hard ban on `git push` in agent flows — wrong-branch and force-push mistakes are not recoverable on a shared remote, and secrets can land in remote history without pre-push scanning. Do NOT push. Stage the local commit (`git add` + `git commit -m \"...\"`), output the commit hash + one-line summary, and wait for explicit user authorization. The user's authorization is per-session, not per-agent; if the user is not present in this turn, surface the prepared commit and stop. Safe shapes are `git push --dry-run` and `git push -h`/`--help` (information only)."
astGrep:
  enabled: true
checkpoint:
  enabled: true
security:
  enabled: true
tools:
  xdevDocs: builtins
task:
  agentAdvisor:
    task: "on"
composer:
  shape: field
theme:
  dark: dark-catppuccin
display:
  showTokenUsage: true
  showTurnTime: true
  cacheMissMarker: true
